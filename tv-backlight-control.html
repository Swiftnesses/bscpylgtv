<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LG TV Control</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: #fff;
            line-height: 1.5;
        }

        .header {
            background: #111;
            border-bottom: 1px solid #222;
            padding: 16px 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        h1 {
            font-size: 20px;
            font-weight: 600;
        }

        .panel {
            background: #111;
            border: 1px solid #222;
            border-radius: 6px;
            padding: 20px;
            margin: 20px 0;
        }

        label {
            display: block;
            font-size: 12px;
            color: #888;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"] {
            width: 100%;
            max-width: 300px;
            padding: 8px 12px;
            background: #000;
            border: 1px solid #333;
            border-radius: 4px;
            color: #fff;
            font-size: 14px;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #c00;
        }

        .btn-row {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        button {
            padding: 8px 16px;
            background: #c00;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            font-weight: 500;
        }

        button:hover:not(:disabled) {
            background: #a00;
        }

        button:disabled {
            background: #222;
            color: #555;
            cursor: not-allowed;
        }

        button.secondary {
            background: #222;
            color: #aaa;
        }

        button.secondary:hover:not(:disabled) {
            background: #2a2a2a;
        }

        button.green {
            background: #0a0;
        }

        button.green:hover:not(:disabled) {
            background: #080;
        }

        .status {
            margin-top: 12px;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            display: none;
        }

        .status.info { background: #003; color: #99f; }
        .status.success { background: #030; color: #9f9; }
        .status.error { background: #300; color: #f99; }
        .status.warning { background: #330; color: #ff9; }

        .cert-help {
            display: none;
            margin-top: 12px;
            padding: 10px;
            background: #221100;
            border-left: 2px solid #f90;
            border-radius: 4px;
            font-size: 12px;
            color: #ccc;
        }

        .cert-help.show { display: block; }

        .controls {
            display: none;
        }

        .controls.active {
            display: block;
        }

        .tabs {
            display: flex;
            gap: 20px;
            border-bottom: 1px solid #222;
            margin: 20px 0;
        }

        .tab {
            padding: 10px 0;
            background: none;
            border: none;
            color: #666;
            font-size: 14px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            font-weight: 500;
        }

        .tab:hover:not(.active) {
            color: #999;
        }

        .tab.active {
            color: #fff;
            border-bottom-color: #c00;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .section {
            background: #111;
            border: 1px solid #222;
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .section h3 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 1px solid #222;
        }

        .setting-row {
            margin-bottom: 14px;
        }

        .setting-row:last-child {
            margin-bottom: 0;
        }

        .setting-row label {
            font-size: 12px;
            color: #888;
        }

        .setting-value {
            color: #fff;
            font-weight: 600;
        }

        select {
            width: 100%;
            padding: 7px 10px;
            background: #000;
            border: 1px solid #333;
            border-radius: 4px;
            color: #fff;
            font-size: 13px;
            cursor: pointer;
        }

        select:focus {
            outline: none;
            border-color: #c00;
        }

        select:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .setting-row.unavailable label {
            color: #444;
        }

        .setting-row.unavailable label::after {
            content: " (unavailable)";
            font-size: 10px;
            font-style: italic;
        }

        input[type="range"] {
            width: calc(100% - 50px);
            height: 2px;
            margin: 8px 0;
            background: #333;
            border-radius: 1px;
            outline: none;
            -webkit-appearance: none;
            vertical-align: middle;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #c00;
            cursor: pointer;
        }

        input[type="range"]::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #c00;
            cursor: pointer;
            border: none;
        }

        input[type="range"]:disabled {
            opacity: 0.2;
        }

        @media (max-width: 768px) {
            .container { padding: 0 12px; }
            h1 { font-size: 18px; }
            .tabs { gap: 12px; overflow-x: auto; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="container">
            <h1>LG TV Control</h1>
        </div>
    </div>

    <div class="container">
        <div class="panel">
            <label for="tvIp">TV IP Address</label>
            <input type="text" id="tvIp" placeholder="192.168.1.100">

            <div class="btn-row">
                <button id="connectBtn" onclick="connect()">Connect</button>
                <button id="disconnectBtn" onclick="disconnect()" disabled>Disconnect</button>
                <button class="secondary" onclick="clearClientKey()">Clear Key</button>
            </div>

            <div id="certHelp" class="cert-help">
                <strong>First time?</strong> Accept the SSL certificate first.
                <br><br>
                <button class="secondary" onclick="openCertPage()">Accept Certificate</button>
            </div>

            <div id="status" class="status info">Ready</div>
        </div>

        <div id="controls" class="controls">
            <button class="green" onclick="refreshAllSettings()">Refresh Settings</button>

            <div class="tabs">
                <button class="tab active" onclick="switchTab('basic')">Basic</button>
                <button class="tab" onclick="switchTab('advanced')">Advanced</button>
                <button class="tab" onclick="switchTab('motion')">Motion</button>
                <button class="tab" onclick="switchTab('ai')">AI/Other</button>
            </div>

            <!-- Basic Tab -->
            <div id="tab-basic" class="tab-content active">
                <div class="section">
                    <h3>Picture Mode</h3>
                    <div class="setting-row">
                        <label>Mode</label>
                        <select id="pictureMode" onchange="setPictureMode(this.value)">
                            <option value="">-- Select --</option>
                            <optgroup label="SDR">
                                <option value="cinema">Cinema</option>
                                <option value="expert1">Expert 1</option>
                                <option value="expert2">Expert 2</option>
                                <option value="filmMaker">Filmmaker</option>
                                <option value="game">Game</option>
                                <option value="vivid">Vivid</option>
                                <option value="normal">Normal</option>
                                <option value="eco">Eco</option>
                                <option value="sports">Sports</option>
                                <option value="photo">Photo</option>
                            </optgroup>
                            <optgroup label="HDR10">
                                <option value="hdrCinema">HDR Cinema</option>
                                <option value="hdrCinemaBright">HDR Cinema Bright</option>
                                <option value="hdrGame">HDR Game</option>
                                <option value="hdrFilmMaker">HDR Filmmaker</option>
                                <option value="hdrVivid">HDR Vivid</option>
                                <option value="hdrStandard">HDR Standard</option>
                            </optgroup>
                            <optgroup label="Dolby Vision">
                                <option value="dolbyHdrCinema">Dolby Cinema</option>
                                <option value="dolbyHdrCinemaBright">Dolby Cinema Bright</option>
                                <option value="dolbyHdrGame">Dolby Game</option>
                                <option value="dolbyHdrVivid">Dolby Vivid</option>
                            </optgroup>
                        </select>
                    </div>
                </div>

                <div class="section">
                    <h3>Basic Settings</h3>

                    <div class="setting-row">
                        <label>Backlight: <span class="setting-value" id="backlightValue">50</span></label>
                        <input type="range" id="backlight" min="0" max="100" value="50" oninput="updateSliderDisplay('backlight', this.value)" onchange="setSetting('backlight', parseInt(this.value))">
                    </div>

                    <div class="setting-row">
                        <label>Contrast: <span class="setting-value" id="contrastValue">85</span></label>
                        <input type="range" id="contrast" min="0" max="100" value="85" oninput="updateSliderDisplay('contrast', this.value)" onchange="setSetting('contrast', parseInt(this.value))">
                    </div>

                    <div class="setting-row">
                        <label>Brightness: <span class="setting-value" id="brightnessValue">50</span></label>
                        <input type="range" id="brightness" min="0" max="100" value="50" oninput="updateSliderDisplay('brightness', this.value)" onchange="setSetting('brightness', parseInt(this.value))">
                    </div>

                    <div class="setting-row">
                        <label>Color: <span class="setting-value" id="colorValue">50</span></label>
                        <input type="range" id="color" min="0" max="100" value="50" oninput="updateSliderDisplay('color', this.value)" onchange="setSetting('color', parseInt(this.value))">
                    </div>

                    <div class="setting-row">
                        <label>Tint: <span class="setting-value" id="tintValue">0</span></label>
                        <input type="range" id="tint" min="-50" max="50" value="0" oninput="updateSliderDisplay('tint', this.value)" onchange="setSetting('tint', parseInt(this.value))">
                    </div>

                    <div class="setting-row">
                        <label>Sharpness: <span class="setting-value" id="sharpnessValue">10</span></label>
                        <input type="range" id="sharpness" min="0" max="50" value="10" oninput="updateSliderDisplay('sharpness', this.value)" onchange="setSetting('sharpness', parseInt(this.value))">
                    </div>

                    <div class="setting-row">
                        <label>Color Temp: <span class="setting-value" id="colorTemperatureValue">0</span></label>
                        <input type="range" id="colorTemperature" min="-50" max="50" value="0" oninput="updateSliderDisplay('colorTemperature', this.value)" onchange="setSetting('colorTemperature', parseInt(this.value))">
                    </div>
                </div>
            </div>

            <!-- Advanced Tab -->
            <div id="tab-advanced" class="tab-content">
                <div class="section">
                    <h3>Advanced</h3>

                    <div class="setting-row">
                        <label>Black Level</label>
                        <select id="blackLevel" onchange="setSetting('blackLevel', this.value)">
                            <option value="auto">Auto</option>
                            <option value="low">Low</option>
                            <option value="high">High</option>
                        </select>
                    </div>

                    <div class="setting-row">
                        <label>Gamma</label>
                        <select id="gamma" onchange="setSetting('gamma', this.value)">
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high1">High 1</option>
                            <option value="high2">High 2</option>
                        </select>
                    </div>

                    <div class="setting-row">
                        <label>Color Gamut</label>
                        <select id="colorGamut" onchange="setSetting('colorGamut', this.value)">
                            <option value="auto">Auto</option>
                            <option value="native">Native</option>
                            <option value="wide">Wide</option>
                        </select>
                    </div>

                    <div class="setting-row">
                        <label>Dynamic Contrast</label>
                        <select id="dynamicContrast" onchange="setSetting('dynamicContrast', this.value)">
                            <option value="off">Off</option>
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>

                    <div class="setting-row">
                        <label>Peak Brightness</label>
                        <select id="peakBrightness" onchange="setSetting('peakBrightness', this.value)">
                            <option value="off">Off</option>
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>

                    <div class="setting-row">
                        <label>Dynamic Color</label>
                        <select id="dynamicColor" onchange="setSetting('dynamicColor', this.value)">
                            <option value="off">Off</option>
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>

                    <div class="setting-row">
                        <label>Super Resolution</label>
                        <select id="superResolution" onchange="setSetting('superResolution', this.value)">
                            <option value="off">Off</option>
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>

                    <div class="setting-row">
                        <label>Noise Reduction</label>
                        <select id="noiseReduction" onchange="setSetting('noiseReduction', this.value)">
                            <option value="off">Off</option>
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                            <option value="auto">Auto</option>
                        </select>
                    </div>

                    <div class="setting-row">
                        <label>MPEG Noise Reduction</label>
                        <select id="mpegNoiseReduction" onchange="setSetting('mpegNoiseReduction', this.value)">
                            <option value="off">Off</option>
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                            <option value="auto">Auto</option>
                        </select>
                    </div>

                    <div class="setting-row">
                        <label>Smooth Gradation</label>
                        <select id="smoothGradation" onchange="setSetting('smoothGradation', this.value)">
                            <option value="off">Off</option>
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>

                    <div class="setting-row">
                        <label>Real Cinema</label>
                        <select id="realCinema" onchange="setSetting('realCinema', this.value)">
                            <option value="on">On</option>
                            <option value="off">Off</option>
                        </select>
                    </div>

                    <div class="setting-row">
                        <label>Eye Comfort</label>
                        <select id="eyeComfortMode" onchange="setSetting('eyeComfortMode', this.value)">
                            <option value="on">On</option>
                            <option value="off">Off</option>
                        </select>
                    </div>
                </div>

                <div class="section">
                    <h3>HDR</h3>

                    <div class="setting-row">
                        <label>HDR Tone Mapping</label>
                        <select id="hdrDynamicToneMapping" onchange="setSetting('hdrDynamicToneMapping', this.value)">
                            <option value="on">On</option>
                            <option value="off">Off</option>
                            <option value="HGIG">HGIG</option>
                        </select>
                    </div>

                    <div class="setting-row">
                        <label>HGIG</label>
                        <select id="hgig" onchange="setSetting('hgig', this.value)">
                            <option value="on">On</option>
                            <option value="off">Off</option>
                        </select>
                    </div>

                    <div class="setting-row">
                        <label>Dolby Precision</label>
                        <select id="dolbyPrecisionDetail" onchange="setSetting('dolbyPrecisionDetail', this.value)">
                            <option value="on">On</option>
                            <option value="off">Off</option>
                        </select>
                    </div>
                </div>

                <div class="section">
                    <h3>Gaming</h3>

                    <div class="setting-row">
                        <label>Black Stabilizer: <span class="setting-value" id="blackStabilizerValue">0</span></label>
                        <input type="range" id="blackStabilizer" min="0" max="20" value="0" oninput="updateSliderDisplay('blackStabilizer', this.value)" onchange="setSetting('blackStabilizer', parseInt(this.value))">
                    </div>

                    <div class="setting-row">
                        <label>White Stabilizer: <span class="setting-value" id="whiteStabilizerValue">0</span></label>
                        <input type="range" id="whiteStabilizer" min="0" max="20" value="0" oninput="updateSliderDisplay('whiteStabilizer', this.value)" onchange="setSetting('whiteStabilizer', parseInt(this.value))">
                    </div>
                </div>

                <div class="section">
                    <h3>White Balance</h3>

                    <div class="setting-row">
                        <label>Color Temp</label>
                        <select id="whiteBalanceColorTemperature" onchange="setSetting('whiteBalanceColorTemperature', this.value)">
                            <option value="cool">Cool</option>
                            <option value="medium">Medium</option>
                            <option value="warm1">Warm 1</option>
                            <option value="warm2">Warm 2</option>
                            <option value="warm3">Warm 3</option>
                        </select>
                    </div>

                    <div class="setting-row">
                        <label>Point</label>
                        <select id="whiteBalancePoint" onchange="setSetting('whiteBalancePoint', this.value)">
                            <option value="low">Low</option>
                            <option value="high">High</option>
                        </select>
                    </div>

                    <div class="setting-row">
                        <label>Red Offset: <span class="setting-value" id="whiteBalanceRedOffsetValue">0</span></label>
                        <input type="range" id="whiteBalanceRedOffset" min="-50" max="50" value="0" oninput="updateSliderDisplay('whiteBalanceRedOffset', this.value)" onchange="setSetting('whiteBalanceRedOffset', parseInt(this.value))">
                    </div>

                    <div class="setting-row">
                        <label>Green Offset: <span class="setting-value" id="whiteBalanceGreenOffsetValue">0</span></label>
                        <input type="range" id="whiteBalanceGreenOffset" min="-50" max="50" value="0" oninput="updateSliderDisplay('whiteBalanceGreenOffset', this.value)" onchange="setSetting('whiteBalanceGreenOffset', parseInt(this.value))">
                    </div>

                    <div class="setting-row">
                        <label>Blue Offset: <span class="setting-value" id="whiteBalanceBlueOffsetValue">0</span></label>
                        <input type="range" id="whiteBalanceBlueOffset" min="-50" max="50" value="0" oninput="updateSliderDisplay('whiteBalanceBlueOffset', this.value)" onchange="setSetting('whiteBalanceBlueOffset', parseInt(this.value))">
                    </div>

                    <div class="setting-row">
                        <label>Red Gain: <span class="setting-value" id="whiteBalanceRedGainValue">0</span></label>
                        <input type="range" id="whiteBalanceRedGain" min="-50" max="50" value="0" oninput="updateSliderDisplay('whiteBalanceRedGain', this.value)" onchange="setSetting('whiteBalanceRedGain', parseInt(this.value))">
                    </div>

                    <div class="setting-row">
                        <label>Green Gain: <span class="setting-value" id="whiteBalanceGreenGainValue">0</span></label>
                        <input type="range" id="whiteBalanceGreenGain" min="-50" max="50" value="0" oninput="updateSliderDisplay('whiteBalanceGreenGain', this.value)" onchange="setSetting('whiteBalanceGreenGain', parseInt(this.value))">
                    </div>

                    <div class="setting-row">
                        <label>Blue Gain: <span class="setting-value" id="whiteBalanceBlueGainValue">0</span></label>
                        <input type="range" id="whiteBalanceBlueGain" min="-50" max="50" value="0" oninput="updateSliderDisplay('whiteBalanceBlueGain', this.value)" onchange="setSetting('whiteBalanceBlueGain', parseInt(this.value))">
                    </div>
                </div>
            </div>

            <!-- Motion Tab -->
            <div id="tab-motion" class="tab-content">
                <div class="section">
                    <h3>Motion</h3>

                    <div class="setting-row">
                        <label>TruMotion</label>
                        <select id="truMotionMode" onchange="setSetting('truMotionMode', this.value, true)">
                            <option value="off">Off</option>
                            <option value="natural">Natural</option>
                            <option value="smooth">Smooth</option>
                            <option value="clear">Clear</option>
                            <option value="cinemaClear">Cinema Clear</option>
                            <option value="user">User</option>
                        </select>
                    </div>

                    <div class="setting-row" id="truMotionBlurRow" style="display: none;">
                        <label>Blur: <span class="setting-value" id="truMotionBlurValue">0</span></label>
                        <input type="range" id="truMotionBlur" min="0" max="10" value="0" oninput="updateSliderDisplay('truMotionBlur', this.value)" onchange="setSetting('truMotionBlur', parseInt(this.value), true)">
                    </div>

                    <div class="setting-row" id="truMotionJudderRow" style="display: none;">
                        <label>Judder: <span class="setting-value" id="truMotionJudderValue">0</span></label>
                        <input type="range" id="truMotionJudder" min="0" max="10" value="0" oninput="updateSliderDisplay('truMotionJudder', this.value)" onchange="setSetting('truMotionJudder', parseInt(this.value), true)">
                    </div>

                    <div class="setting-row">
                        <label>Motion Eye Care</label>
                        <select id="motionEyeCare" onchange="setSetting('motionEyeCare', this.value)">
                            <option value="on">On</option>
                            <option value="off">Off</option>
                        </select>
                    </div>

                    <div class="setting-row">
                        <label>Motion Pro</label>
                        <select id="motionProOLED" onchange="setSetting('motionProOLED', this.value)">
                            <option value="off">Off</option>
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                            <option value="auto">Auto</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- AI/Other Tab -->
            <div id="tab-ai" class="tab-content">
                <div class="section">
                    <h3>AI Picture</h3>
                    <p style="font-size: 11px; color: #666; margin-bottom: 12px;">Note: AI settings can only be set, not read.</p>

                    <div class="setting-row">
                        <label>AI Picture</label>
                        <div class="btn-row">
                            <button class="green" onclick="setAISetting('ai_Picture', 'on')">ON</button>
                            <button style="background:#c00" onclick="setAISetting('ai_Picture', 'off')">OFF</button>
                        </div>
                    </div>

                    <div class="setting-row">
                        <label>AI Brightness</label>
                        <div class="btn-row">
                            <button class="green" onclick="setAISetting('ai_Brightness', 'on')">ON</button>
                            <button style="background:#c00" onclick="setAISetting('ai_Brightness', 'off')">OFF</button>
                        </div>
                    </div>

                    <div class="setting-row">
                        <label>AI Genre</label>
                        <div class="btn-row">
                            <button class="green" onclick="setAISetting('ai_Genre', 'on')">ON</button>
                            <button style="background:#c00" onclick="setAISetting('ai_Genre', 'off')">OFF</button>
                        </div>
                    </div>
                </div>

                <div class="section">
                    <h3>Other</h3>

                    <div class="setting-row">
                        <label>Energy Saving</label>
                        <select id="energySaving" onchange="setSetting('energySaving', this.value)">
                            <option value="off">Off</option>
                            <option value="min">Minimum</option>
                            <option value="med">Medium</option>
                            <option value="max">Maximum</option>
                            <option value="auto">Auto</option>
                            <option value="screen_off">Screen Off</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let messageId = 0;
        let clientKey = localStorage.getItem('lgTvClientKey') || null;
        let connected = false;
        let useSecure = true;  // New TVs require wss:// on port 3001
        let pendingRefreshRequests = 0;
        let requestedSettings = {};  // Track which settings we requested per message ID

        function connect() {
            const ip = document.getElementById('tvIp').value.trim();
            if (!ip) {
                showStatus('Please enter a TV IP address', 'error');
                return;
            }

            showCertHelp(false);  // Hide cert help when attempting connection

            let wsUrl;
            if (USE_PROXY) {
                wsUrl = PROXY_URL;
                showStatus('Connecting via proxy server...', 'info');
                console.log('Connecting via proxy:', wsUrl, '-> TV:', ip);
            } else {
                wsUrl = `wss://${ip}:3001`;
                showStatus('Connecting to TV...', 'info');
                console.log('Connecting directly to TV:', wsUrl);
            }

            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                console.log('WebSocket connected');
                showStatus('WebSocket connected, registering...', 'info');

                // If using proxy, send TV IP first
                if (USE_PROXY) {
                    ws.send(JSON.stringify({
                        type: '__PROXY_SET_TV_IP__',
                        ip: ip
                    }));
                    console.log('Sent TV IP to proxy:', ip);
                }

                // Send registration message
                const registrationMsg = {
                    "type": "register",
                    "id": "register_0",
                    "payload": clientKey ? {...REGISTRATION_PAYLOAD, "client-key": clientKey} : REGISTRATION_PAYLOAD
                };

                console.log('Sending registration:', registrationMsg);
                ws.send(JSON.stringify(registrationMsg));
            };

            ws.onmessage = (event) => {
                console.log('Received:', event.data);
                const message = JSON.parse(event.data);

                if (message.type === 'response' && message.id === 'register_0') {
                    if (message.payload.pairingType === 'PROMPT') {
                        showStatus('Please accept the connection on your TV!', 'warning');
                    }
                } else if (message.type === 'registered') {
                    clientKey = message.payload['client-key'];
                    // Save client key for future connections
                    localStorage.setItem('lgTvClientKey', clientKey);
                    console.log('Registered! Client key:', clientKey);
                    showStatus('Connected successfully!', 'success');
                    updateUI(true);

                    // Refresh all settings
                    refreshAllSettings();
                } else if (message.type === 'response') {
                    // Handle alert responses (Luna API hack)
                    if (message.id.startsWith('alert_') && message.payload && message.payload.alertId) {
                        const alertId = message.payload.alertId;
                        console.log(`Alert created with ID: ${alertId}, closing it...`);

                        // Close the alert immediately
                        messageId++;
                        ws.send(JSON.stringify({
                            "id": `close_alert_${messageId}`,
                            "type": "request",
                            "uri": "ssap://system.notifications/closeAlert",
                            "payload": {
                                "alertId": alertId
                            }
                        }));

                        showStatus('AI setting applied successfully', 'success');
                        return;
                    }

                    // Handle response messages
                    if (message.payload && message.payload.settings) {
                        updateSettingsUI(message.payload.settings);

                        // Show success message for set operations only
                        if (message.id.startsWith('set_')) {
                            showStatus('Setting applied successfully', 'success');
                        } else if (message.id.startsWith('get_')) {
                            // Check which requested settings were NOT returned and grey them out
                            const requestedKeys = requestedSettings[message.id] || [];
                            const returnedKeys = Object.keys(message.payload.settings);
                            const missingKeys = requestedKeys.filter(key => !returnedKeys.includes(key));

                            // Detailed logging for diagnostics
                            console.group(`📥 GET Response: ${message.id}`);
                            console.log('Category:', message.payload.category);
                            console.log('Requested:', requestedKeys);
                            console.log('Returned:', returnedKeys);
                            if (missingKeys.length > 0) {
                                console.warn('⚠️ Missing keys:', missingKeys);
                            }
                            console.log('Values:', message.payload.settings);
                            console.log('Full response:', message);
                            console.groupEnd();

                            if (missingKeys.length > 0) {
                                missingKeys.forEach(key => markSettingUnavailable(key));
                            }

                            // Track refresh completion
                            if (pendingRefreshRequests > 0) {
                                pendingRefreshRequests--;
                                if (pendingRefreshRequests === 0) {
                                    showStatus('Settings loaded!', 'success');
                                }
                            }
                        }
                    }
                } else if (message.type === 'error') {
                    // Handle errors gracefully - some settings may not be available on all TV models
                    if (message.id.startsWith('get_')) {
                        // Parse which keys failed and mark them as unavailable
                        const errorText = message.payload?.errorText || message.error || '';

                        console.group(`❌ GET Error: ${message.id}`);
                        console.log('Error text:', errorText);
                        console.log('Requested keys:', requestedSettings[message.id] || []);
                        console.log('Full error payload:', message.payload);
                        console.log('Full error message:', message);

                        if (errorText.includes('not allowed') || errorText.includes('not available') || errorText.includes("doesn't support")) {
                            // Extract which specific key(s) failed from the error message
                            const failedKeys = [];

                            // Pattern 1: "Some keys are not allowed for the request. ( keyName )"
                            const pattern1 = /\(\s*([^)]+)\s*\)/;
                            const match1 = errorText.match(pattern1);
                            if (match1) {
                                failedKeys.push(match1[1].trim());
                            }

                            // Pattern 2: "doesn't support the key(s): key1,key2,key3"
                            // Fixed: match after colon, not including "key(s):"
                            const pattern2 = /key\(s\):\s*(.+)$/;
                            const match2 = errorText.match(pattern2);
                            if (match2) {
                                const keys = match2[1].split(',').map(k => k.trim()).filter(k => k.length > 1);
                                failedKeys.push(...keys);
                            }

                            console.log('Parsed failed keys:', failedKeys);

                            if (failedKeys.length > 0) {
                                console.log(`✓ Marking failed keys unavailable:`, failedKeys);
                                failedKeys.forEach(key => markSettingUnavailable(key));

                                // Retry the successful keys from this batch
                                const requestedKeys = requestedSettings[message.id] || [];
                                const successfulKeys = requestedKeys.filter(key => !failedKeys.includes(key));

                                if (successfulKeys.length > 0) {
                                    console.log(`🔄 Retrying ${successfulKeys.length} keys:`, successfulKeys);
                                    console.groupEnd();

                                    messageId++;
                                    const retryId = `${message.id}_retry_${messageId}`;
                                    requestedSettings[retryId] = successfulKeys;

                                    // Determine category from original message ID
                                    let category = 'picture';
                                    if (message.id.includes('_ai_')) {
                                        category = 'aiPicture';
                                    }

                                    const retryRequest = {
                                        "id": retryId,
                                        "type": "request",
                                        "uri": "ssap://settings/getSystemSettings",
                                        "payload": {
                                            "category": category,
                                            "keys": successfulKeys
                                        }
                                    };

                                    // Add current_app for truMotionMode only
                                    if (message.id.includes('_trumotion_') || successfulKeys.includes('truMotionMode')) {
                                        retryRequest.payload.current_app = true;
                                    }

                                    console.log(`📤 Sending retry request (category: ${category}):`, retryRequest);
                                    ws.send(JSON.stringify(retryRequest));
                                    // Don't decrement pendingRefreshRequests yet, wait for retry
                                    return;
                                } else {
                                    console.log('✓ No keys to retry');
                                    console.groupEnd();
                                }
                            } else {
                                // Couldn't parse error, try individual requests for each key
                                const requestedKeys = requestedSettings[message.id] || [];
                                console.warn(`⚠️ Could not parse specific failed keys`);
                                console.log(`🔄 Trying each of ${requestedKeys.length} keys individually`);
                                console.groupEnd();

                                // Try each key individually to see which ones work
                                requestedKeys.forEach(key => {
                                    messageId++;
                                    const individualId = `${message.id}_individual_${key}_${messageId}`;
                                    requestedSettings[individualId] = [key];

                                    let category = 'picture';
                                    if (message.id.includes('_ai_')) {
                                        category = 'aiPicture';
                                    }

                                    const individualRequest = {
                                        "id": individualId,
                                        "type": "request",
                                        "uri": "ssap://settings/getSystemSettings",
                                        "payload": {
                                            "category": category,
                                            "keys": [key]
                                        }
                                    };

                                    // Add current_app for truMotionMode only
                                    if (message.id.includes('_trumotion_') || key === 'truMotionMode') {
                                        individualRequest.payload.current_app = true;
                                    }

                                    ws.send(JSON.stringify(individualRequest));
                                });
                                // Don't decrement pendingRefreshRequests yet, wait for individual responses
                                return;
                            }
                        } else {
                            // Generic error with no specific key info - try each key individually
                            const requestedKeys = requestedSettings[message.id] || [];

                            // Only try individual requests if we haven't already (avoid infinite retry loops)
                            if (requestedKeys.length > 1 && !message.id.includes('_individual_')) {
                                console.warn(`⚠️ Generic error - trying ${requestedKeys.length} keys individually`);
                                console.groupEnd();

                                // Try each key individually to see which ones work
                                requestedKeys.forEach(key => {
                                    messageId++;
                                    const individualId = `${message.id}_individual_${key}_${messageId}`;
                                    requestedSettings[individualId] = [key];

                                    let category = 'picture';
                                    if (message.id.includes('_ai_')) {
                                        category = 'aiPicture';
                                    }

                                    const individualRequest = {
                                        "id": individualId,
                                        "type": "request",
                                        "uri": "ssap://settings/getSystemSettings",
                                        "payload": {
                                            "category": category,
                                            "keys": [key]
                                        }
                                    };

                                    // Add current_app for truMotionMode only
                                    if (message.id.includes('_trumotion_') || key === 'truMotionMode') {
                                        individualRequest.payload.current_app = true;
                                    }

                                    console.log(`📤 Trying individual key (${category}):`, individualRequest);
                                    ws.send(JSON.stringify(individualRequest));
                                });
                                // Don't decrement pendingRefreshRequests yet, wait for individual responses
                                return;
                            } else {
                                // Already tried individually or single key - mark as unavailable
                                console.log('⚠️ Generic error (marking unavailable - already tried individually)');
                                console.log('Affected keys:', requestedKeys);
                                requestedKeys.forEach(key => markSettingUnavailable(key));
                                console.groupEnd();
                            }
                        }

                        // Track refresh completion even on error
                        if (pendingRefreshRequests > 0) {
                            pendingRefreshRequests--;
                            if (pendingRefreshRequests === 0) {
                                showStatus('Settings loaded (some not available on this TV)', 'success');
                            }
                        }
                    } else if (message.id.startsWith('set_')) {
                        // Check if it's a "not allowed" error (setting doesn't exist)
                        const errorText = message.payload?.errorText || message.error || '';
                        if (errorText.includes('not allowed') || errorText.includes('not available')) {
                            // Extract setting name from message ID (format: set_settingName_messageId)
                            const settingName = message.id.replace(/^set_/, '').replace(/_\d+$/, '');
                            console.log(`Setting not available on this TV: ${settingName}`);

                            // Mark as unavailable in UI
                            markSettingUnavailable(settingName);
                        } else {
                            // Show other errors (invalid values, etc.)
                            showStatus(`Error: ${errorText}`, 'error');
                        }
                    } else {
                        // Other errors
                        showStatus(`Error: ${message.error}`, 'error');
                        console.error('TV error:', message);
                    }
                }
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                showStatus('Connection failed. You may need to accept the SSL certificate first.', 'error');
                showCertHelp(true);
            };

            ws.onclose = (event) => {
                console.log('WebSocket closed', event);

                if (!connected && event.code !== 1000) {
                    // Check for invalid origin error (code 1008)
                    if (event.code === 1008 && event.reason === 'invalid origin') {
                        // Clear saved client key and try to help user
                        clientKey = null;
                        localStorage.removeItem('lgTvClientKey');
                        showStatus('Connection rejected by TV (invalid origin). Try opening this file from a local web server, or clear your TV\'s registered apps list.', 'error');
                    } else {
                        // Connection failed before establishing
                        showStatus('Connection failed. You may need to accept the SSL certificate first.', 'error');
                        showCertHelp(true);
                    }
                } else if (connected) {
                    showStatus('Disconnected from TV', 'info');
                }

                updateUI(false);
                ws = null;
            };
        }

        function disconnect() {
            if (ws) {
                ws.close();
                ws = null;
            }
            updateUI(false);
            showStatus('Disconnected', 'info');
        }

        function clearClientKey() {
            clientKey = null;
            localStorage.removeItem('lgTvClientKey');
            showStatus('Saved client key cleared. Try connecting again.', 'info');
        }

        // Tab switching
        function switchTab(tabName) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });

            // Show selected tab
            document.getElementById(`tab-${tabName}`).classList.add('active');
            event.target.classList.add('active');
        }

        // Generic setting function
        function setSetting(settingName, value, currentApp = false) {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                showStatus('Not connected to TV', 'error');
                return;
            }

            messageId++;
            const payload = {
                "category": "picture",
                "settings": {}
            };
            // Convert all values to strings to match Python library behavior
            payload.settings[settingName] = String(value);

            if (currentApp) {
                payload.current_app = true;
            }

            const message = {
                "id": `set_${settingName}_${messageId}`,
                "type": "request",
                "uri": "ssap://settings/setSystemSettings",
                "payload": payload
            };

            console.log(`Setting ${settingName} to:`, value);
            ws.send(JSON.stringify(message));
            showStatus(`Setting ${settingName}...`, 'info');

            // Handle TruMotion mode changes
            if (settingName === 'truMotionMode') {
                const blurRow = document.getElementById('truMotionBlurRow');
                const judderRow = document.getElementById('truMotionJudderRow');
                if (value === 'user') {
                    blurRow.style.display = 'block';
                    judderRow.style.display = 'block';
                } else {
                    blurRow.style.display = 'none';
                    judderRow.style.display = 'none';
                }
            }
        }

        // Mark a setting as unavailable in the UI
        function markSettingUnavailable(settingName) {
            const element = document.getElementById(settingName);
            if (element) {
                // Disable the control
                element.disabled = true;

                // Mark the row as unavailable
                const row = element.closest('.setting-row');
                if (row) {
                    row.classList.add('unavailable');
                }
            }
        }

        // AI settings (use alert hack to access Luna API like Python library)
        function setAISetting(settingName, value) {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                showStatus('Not connected to TV', 'error');
                return;
            }

            messageId++;

            // Prepare Luna API parameters
            const lunaParams = {
                "category": "aiPicture",
                "settings": {}
            };
            lunaParams.settings[settingName] = value;

            // Luna URI for the alert hack
            const lunaUri = "luna://com.webos.settingsservice/setSystemSettings";

            // Create alert with Luna API call in onClick/onclose/onfail
            // This is the same hack used by the Python library
            const alertPayload = {
                "message": " ",
                "buttons": [
                    {
                        "label": "",
                        "onClick": lunaUri,
                        "params": lunaParams
                    }
                ],
                "onclose": {
                    "uri": lunaUri,
                    "params": lunaParams
                },
                "onfail": {
                    "uri": lunaUri,
                    "params": lunaParams
                }
            };

            const createAlertMsg = {
                "id": `alert_${settingName}_${messageId}`,
                "type": "request",
                "uri": "ssap://system.notifications/createAlert",
                "payload": alertPayload
            };

            console.log(`Setting AI ${settingName} to ${value} via Luna alert hack:`, createAlertMsg);
            ws.send(JSON.stringify(createAlertMsg));

            // Close the alert immediately after creating it
            // We'll get the alertId from the response and close it
            showStatus(`Setting ${settingName}...`, 'info');
        }

        // Picture mode setting
        function setPictureMode(mode) {
            if (!mode) return;
            setSetting('pictureMode', mode);
        }

        // Update slider display
        function updateSliderDisplay(settingName, value) {
            document.getElementById(`${settingName}Value`).textContent = value;
        }

        // Refresh all settings (split into chunks to avoid overwhelming TV)
        function refreshAllSettings() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                showStatus('Not connected to TV', 'error');
                return;
            }

            showStatus('Refreshing settings...', 'info');
            pendingRefreshRequests = 7;  // Number of refresh requests we're about to send
            requestedSettings = {};  // Clear previous tracking

            // Basic settings
            messageId++;
            const basicKeys = ["pictureMode", "backlight", "contrast", "brightness", "color", "tint", "sharpness", "colorTemperature"];
            requestedSettings[`get_basic_${messageId}`] = basicKeys;
            ws.send(JSON.stringify({
                "id": `get_basic_${messageId}`,
                "type": "request",
                "uri": "ssap://settings/getSystemSettings",
                "payload": {
                    "category": "picture",
                    "keys": basicKeys
                }
            }));

            // Advanced picture settings
            messageId++;
            const advancedKeys = ["blackLevel", "gamma", "colorGamut", "dynamicContrast", "peakBrightness", "dynamicColor", "superResolution"];
            requestedSettings[`get_advanced_${messageId}`] = advancedKeys;
            ws.send(JSON.stringify({
                "id": `get_advanced_${messageId}`,
                "type": "request",
                "uri": "ssap://settings/getSystemSettings",
                "payload": {
                    "category": "picture",
                    "keys": advancedKeys
                }
            }));

            // Noise reduction & other
            messageId++;
            const nrKeys = ["noiseReduction", "mpegNoiseReduction", "smoothGradation", "realCinema", "eyeComfortMode", "energySaving"];
            requestedSettings[`get_nr_${messageId}`] = nrKeys;
            ws.send(JSON.stringify({
                "id": `get_nr_${messageId}`,
                "type": "request",
                "uri": "ssap://settings/getSystemSettings",
                "payload": {
                    "category": "picture",
                    "keys": nrKeys
                }
            }));

            // HDR & gaming settings
            messageId++;
            const hdrKeys = ["hdrDynamicToneMapping", "hgig", "dolbyPrecisionDetail", "blackStabilizer", "whiteStabilizer"];
            requestedSettings[`get_hdr_${messageId}`] = hdrKeys;
            ws.send(JSON.stringify({
                "id": `get_hdr_${messageId}`,
                "type": "request",
                "uri": "ssap://settings/getSystemSettings",
                "payload": {
                    "category": "picture",
                    "keys": hdrKeys
                }
            }));

            // White balance settings
            messageId++;
            const wbKeys = ["whiteBalanceColorTemperature", "whiteBalancePoint", "whiteBalanceRedOffset", "whiteBalanceGreenOffset", "whiteBalanceBlueOffset", "whiteBalanceRedGain", "whiteBalanceGreenGain", "whiteBalanceBlueGain"];
            requestedSettings[`get_wb_${messageId}`] = wbKeys;
            ws.send(JSON.stringify({
                "id": `get_wb_${messageId}`,
                "type": "request",
                "uri": "ssap://settings/getSystemSettings",
                "payload": {
                    "category": "picture",
                    "keys": wbKeys
                }
            }));

            // Motion settings - split into two requests
            // 1. truMotionMode requires current_app parameter
            messageId++;
            requestedSettings[`get_trumotion_${messageId}`] = ["truMotionMode"];
            const truMotionRequest = {
                "id": `get_trumotion_${messageId}`,
                "type": "request",
                "uri": "ssap://settings/getSystemSettings",
                "payload": {
                    "category": "picture",
                    "keys": ["truMotionMode"],
                    "current_app": true  // Required for truMotionMode
                }
            };
            console.log(`📤 Requesting truMotionMode with current_app=true:`, truMotionRequest);
            ws.send(JSON.stringify(truMotionRequest));

            // 2. Other motion settings WITHOUT current_app
            messageId++;
            const otherMotionKeys = ["truMotionBlur", "truMotionJudder", "motionEyeCare", "motionProOLED"];
            requestedSettings[`get_motion_${messageId}`] = otherMotionKeys;
            const motionRequest = {
                "id": `get_motion_${messageId}`,
                "type": "request",
                "uri": "ssap://settings/getSystemSettings",
                "payload": {
                    "category": "picture",
                    "keys": otherMotionKeys
                }
            };
            console.log(`📤 Requesting other motion settings (no current_app):`, motionRequest);
            ws.send(JSON.stringify(motionRequest));

            // AI settings - NOTE: Python library only shows SET operations for AI settings,
            // never GET. This suggests AI settings may not be readable via the API.
            // Commenting out for now since they always fail with "doesn't support the key(s)"
            /*
            messageId++;

        // Update UI with received settings
        function updateSettingsUI(settings) {
            for (let [key, value] of Object.entries(settings)) {
                // Handle special case: blackLevel sometimes returns an object with TV standards
                if (key === 'blackLevel' && typeof value === 'object' && value !== null) {
                    // Extract unique values from the object
                    const uniqueValues = [...new Set(Object.values(value))];
                    if (uniqueValues.length === 1) {
                        // All standards have the same value, use it
                        value = uniqueValues[0];
                        console.log(`blackLevel object normalized to: ${value}`);
                    } else {
                        // Different values per standard, can't display in simple dropdown
                        console.warn(`blackLevel has multiple values per TV standard:`, value);
                        markSettingUnavailable(key);
                        continue;
                    }
                }

                const element = document.getElementById(key);
                if (element) {
                    // Successfully retrieved - ensure it's enabled
                    element.disabled = false;
                    const row = element.closest('.setting-row');
                    if (row) {
                        row.classList.remove('unavailable');
                    }

                    if (element.type === 'range') {
                        element.value = value;
                        updateSliderDisplay(key, value);
                    } else if (element.tagName === 'SELECT') {
                        // Check if the value exists in the dropdown options
                        const optionExists = Array.from(element.options).some(opt => opt.value === value);
                        if (optionExists) {
                            element.value = value;
                        } else {
                            console.warn(`Setting ${key}: value "${value}" not found in dropdown options`, Array.from(element.options).map(o => o.value));
                        }
                    }
                } else {
                    console.warn(`Setting ${key}: element not found in HTML`);
                }
            }

            // Handle TruMotion visibility
            if (settings.truMotionMode) {
                const blurRow = document.getElementById('truMotionBlurRow');
                const judderRow = document.getElementById('truMotionJudderRow');
                if (settings.truMotionMode === 'user') {
                    blurRow.style.display = 'block';
                    judderRow.style.display = 'block';
                } else {
                    blurRow.style.display = 'none';
                    judderRow.style.display = 'none';
                }
            }
        }

        // Grey out settings that failed to retrieve
        function markSettingsUnavailableFromKeys(keys) {
            keys.forEach(key => {
                markSettingUnavailable(key);
            });
        }
    </script>
