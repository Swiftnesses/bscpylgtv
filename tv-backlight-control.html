<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LG TV Control</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #a50034;
            --bg: #ffffff;
            --surface: #f8f9fa;
            --border: #e1e4e8;
            --text: #24292e;
            --text-secondary: #6a737d;
            --success: #28a745;
            --radius: 12px;
            --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.08);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        /* Header */
        .header {
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow);
        }

        .header-inner {
            max-width: 1280px;
            margin: 0 auto;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 18px;
            font-weight: 600;
            color: var(--text);
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: var(--primary);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
        }

        .hamburger {
            display: none;
            width: 40px;
            height: 40px;
            border: none;
            background: none;
            cursor: pointer;
            flex-direction: column;
            justify-content: center;
            gap: 6px;
            padding: 8px;
        }

        .hamburger span {
            width: 100%;
            height: 2px;
            background: var(--text);
            border-radius: 2px;
            transition: all 0.3s;
        }

        .hamburger.active span:nth-child(1) {
            transform: rotate(45deg) translate(6px, 6px);
        }

        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }

        .hamburger.active span:nth-child(3) {
            transform: rotate(-45deg) translate(6px, -6px);
        }

        /* Main Container */
        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 32px 20px;
        }

        /* Sidebar Navigation */
        .layout {
            display: grid;
            grid-template-columns: 240px 1fr;
            gap: 32px;
        }

        .sidebar {
            position: sticky;
            top: 80px;
            height: fit-content;
        }

        .nav {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 8px;
            border: 1px solid var(--border);
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            transition: all 0.2s;
        }

        .nav-item:hover {
            background: rgba(0,0,0,0.04);
            color: var(--text);
        }

        .nav-item.active {
            background: var(--primary);
            color: white;
        }

        .nav-icon {
            font-size: 18px;
        }

        /* Connection Card */
        .card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: var(--shadow);
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--text-secondary);
        }

        .form-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.2s;
            background: var(--bg);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(165, 0, 52, 0.1);
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: #8a002b;
        }

        .btn-secondary {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover:not(:disabled) {
            background: #e9ecef;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* Status Messages */
        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            margin-top: 16px;
            display: none;
            border-left: 3px solid;
        }

        .alert.info {
            background: #e7f3ff;
            color: #0969da;
            border-color: #0969da;
        }

        .alert.success {
            background: #dafbe1;
            color: #1a7f37;
            border-color: #1a7f37;
        }

        .alert.error {
            background: #ffebe9;
            color: #cf222e;
            border-color: #cf222e;
        }

        .alert.warning {
            background: #fff8c5;
            color: #9a6700;
            border-color: #9a6700;
        }

        /* Content Sections */
        .content {
            display: none;
        }

        .content.active {
            display: block;
        }

        .section {
            margin-bottom: 32px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text);
        }

        .settings-grid {
            display: grid;
            gap: 20px;
        }

        .setting-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .setting-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .setting-value {
            font-weight: 600;
            color: var(--primary);
        }

        .select {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            background: var(--bg);
            cursor: pointer;
            transition: all 0.2s;
        }

        .select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(165, 0, 52, 0.1);
        }

        .select:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .slider {
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: var(--border);
            outline: none;
            -webkit-appearance: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            box-shadow: var(--shadow);
        }

        .slider::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            border: none;
            box-shadow: var(--shadow);
        }

        .slider:disabled {
            opacity: 0.3;
        }

        .setting-item.unavailable .setting-label {
            color: #959da5;
        }

        .setting-item.unavailable .setting-label::after {
            content: " (unavailable)";
            font-size: 11px;
            font-style: italic;
        }

        .toggle-buttons {
            display: flex;
            gap: 8px;
        }

        .btn-sm {
            padding: 6px 16px;
            font-size: 13px;
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-success:hover:not(:disabled) {
            background: #218838;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover:not(:disabled) {
            background: #c82333;
        }

        .note {
            font-size: 12px;
            color: var(--text-secondary);
            padding: 12px;
            background: var(--surface);
            border-radius: 8px;
            margin-bottom: 16px;
        }

        /* Mobile Menu Overlay */
        .mobile-menu {
            display: none;
            position: fixed;
            top: 65px;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg);
            z-index: 99;
            padding: 20px;
            overflow-y: auto;
        }

        .mobile-menu.active {
            display: block;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hamburger {
                display: flex;
            }

            .layout {
                grid-template-columns: 1fr;
            }

            .sidebar {
                display: none;
            }

            .container {
                padding: 20px 16px;
            }

            .header-inner {
                padding: 12px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-inner">
            <div class="logo">
                <div class="logo-icon">📺</div>
                <span>LG TV Control</span>
            </div>
            <button class="hamburger" onclick="toggleMenu()">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </div>

    <div class="mobile-menu" id="mobileMenu">
        <div class="nav">
            <button class="nav-item active" onclick="showSection('connection')">
                <span class="nav-icon">🔌</span> Connection
            </button>
            <button class="nav-item" onclick="showSection('basic')">
                <span class="nav-icon">⚙️</span> Basic
            </button>
            <button class="nav-item" onclick="showSection('advanced')">
                <span class="nav-icon">🎛️</span> Advanced
            </button>
            <button class="nav-item" onclick="showSection('motion')">
                <span class="nav-icon">🎬</span> Motion
            </button>
            <button class="nav-item" onclick="showSection('ai')">
                <span class="nav-icon">🤖</span> AI/Other
            </button>
        </div>
    </div>

    <div class="container">
        <div class="layout">
            <aside class="sidebar">
                <nav class="nav">
                    <button class="nav-item active" onclick="showSection('connection')">
                        <span class="nav-icon">🔌</span> Connection
                    </button>
                    <button class="nav-item" onclick="showSection('basic')">
                        <span class="nav-icon">⚙️</span> Basic
                    </button>
                    <button class="nav-item" onclick="showSection('advanced')">
                        <span class="nav-icon">🎛️</span> Advanced
                    </button>
                    <button class="nav-item" onclick="showSection('motion')">
                        <span class="nav-icon">🎬</span> Motion
                    </button>
                    <button class="nav-item" onclick="showSection('ai')">
                        <span class="nav-icon">🤖</span> AI/Other
                    </button>
                </nav>
            </aside>

            <main>
                <!-- Connection Section -->
                <div id="section-connection" class="content active">
                    <div class="card">
                        <h2 class="card-title">Connect to TV</h2>

                        <div class="form-group">
                            <label class="form-label">TV IP Address</label>
                            <input type="text" id="tvIp" class="form-input" placeholder="192.168.1.100">
                        </div>

                        <div class="btn-group">
                            <button id="connectBtn" class="btn btn-primary" onclick="connect()">Connect</button>
                            <button id="disconnectBtn" class="btn btn-secondary" onclick="disconnect()" disabled>Disconnect</button>
                            <button class="btn btn-secondary" onclick="clearClientKey()">Clear Key</button>
                        </div>

                        <div id="certHelp" class="alert warning" style="display:none">
                            <strong>First time?</strong> Accept the SSL certificate first.
                            <br><br>
                            <button class="btn btn-secondary btn-sm" onclick="openCertPage()">Accept Certificate</button>
                        </div>

                        <div id="status" class="alert info">Ready to connect</div>
                    </div>

                    <div id="controls" style="display:none">
                        <button class="btn btn-success" onclick="refreshAllSettings()">🔄 Refresh All Settings</button>
                    </div>
                </div>

                <!-- Basic Section -->
                <div id="section-basic" class="content">
                    <div class="section">
                        <h2 class="section-title">Picture Mode</h2>
                        <div class="card">
                            <div class="settings-grid">
                                <div class="setting-item">
                                    <label class="setting-label">Mode</label>
                                    <select id="pictureMode" class="select" onchange="setPictureMode(this.value)">
                                        <option value="">Select mode</option>
                                        <optgroup label="SDR">
                                            <option value="cinema">Cinema</option>
                                            <option value="expert1">Expert 1</option>
                                            <option value="expert2">Expert 2</option>
                                            <option value="filmMaker">Filmmaker</option>
                                            <option value="game">Game</option>
                                            <option value="vivid">Vivid</option>
                                            <option value="normal">Normal</option>
                                            <option value="eco">Eco</option>
                                            <option value="sports">Sports</option>
                                            <option value="photo">Photo</option>
                                        </optgroup>
                                        <optgroup label="HDR10">
                                            <option value="hdrCinema">HDR Cinema</option>
                                            <option value="hdrCinemaBright">HDR Cinema Bright</option>
                                            <option value="hdrGame">HDR Game</option>
                                            <option value="hdrFilmMaker">HDR Filmmaker</option>
                                            <option value="hdrVivid">HDR Vivid</option>
                                            <option value="hdrStandard">HDR Standard</option>
                                        </optgroup>
                                        <optgroup label="Dolby Vision">
                                            <option value="dolbyHdrCinema">Dolby Cinema</option>
                                            <option value="dolbyHdrCinemaBright">Dolby Cinema Bright</option>
                                            <option value="dolbyHdrGame">Dolby Game</option>
                                            <option value="dolbyHdrVivid">Dolby Vivid</option>
                                        </optgroup>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="section">
                        <h2 class="section-title">Picture Settings</h2>
                        <div class="card">
                            <div class="settings-grid">
                                <div class="setting-item">
                                    <label class="setting-label">Backlight <span class="setting-value" id="backlightValue">50</span></label>
                                    <input type="range" id="backlight" class="slider" min="0" max="100" value="50" oninput="updateSliderDisplay('backlight', this.value)" onchange="setSetting('backlight', parseInt(this.value))">
                                </div>

                                <div class="setting-item">
                                    <label class="setting-label">Contrast <span class="setting-value" id="contrastValue">85</span></label>
                                    <input type="range" id="contrast" class="slider" min="0" max="100" value="85" oninput="updateSliderDisplay('contrast', this.value)" onchange="setSetting('contrast', parseInt(this.value))">
                                </div>

                                <div class="setting-item">
                                    <label class="setting-label">Brightness <span class="setting-value" id="brightnessValue">50</span></label>
                                    <input type="range" id="brightness" class="slider" min="0" max="100" value="50" oninput="updateSliderDisplay('brightness', this.value)" onchange="setSetting('brightness', parseInt(this.value))">
                                </div>

                                <div class="setting-item">
                                    <label class="setting-label">Color <span class="setting-value" id="colorValue">50</span></label>
                                    <input type="range" id="color" class="slider" min="0" max="100" value="50" oninput="updateSliderDisplay('color', this.value)" onchange="setSetting('color', parseInt(this.value))">
                                </div>

                                <div class="setting-item">
                                    <label class="setting-label">Sharpness <span class="setting-value" id="sharpnessValue">10</span></label>
                                    <input type="range" id="sharpness" class="slider" min="0" max="50" value="10" oninput="updateSliderDisplay('sharpness', this.value)" onchange="setSetting('sharpness', parseInt(this.value))">
                                </div>

                                <div class="setting-item">
                                    <label class="setting-label">Tint <span class="setting-value" id="tintValue">0</span></label>
                                    <input type="range" id="tint" class="slider" min="-50" max="50" value="0" oninput="updateSliderDisplay('tint', this.value)" onchange="setSetting('tint', parseInt(this.value))">
                                </div>

                                <div class="setting-item">
                                    <label class="setting-label">Color Temperature <span class="setting-value" id="colorTemperatureValue">0</span></label>
                                    <input type="range" id="colorTemperature" class="slider" min="-50" max="50" value="0" oninput="updateSliderDisplay('colorTemperature', this.value)" onchange="setSetting('colorTemperature', parseInt(this.value))">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Advanced Section -->
                <div id="section-advanced" class="content">
                    <div class="section">
                        <h2 class="section-title">Advanced Settings</h2>
                        <div class="card">
                            <div class="settings-grid">
                                <div class="setting-item">
                                    <label class="setting-label">Black Level</label>
                                    <select id="blackLevel" class="select" onchange="setSetting('blackLevel', this.value)">
                                        <option value="auto">Auto</option>
                                        <option value="low">Low</option>
                                        <option value="high">High</option>
                                    </select>
                                </div>

                                <div class="setting-item">
                                    <label class="setting-label">Gamma</label>
                                    <select id="gamma" class="select" onchange="setSetting('gamma', this.value)">
                                        <option value="low">Low</option>
                                        <option value="medium">Medium</option>
                                        <option value="high1">High 1</option>
                                        <option value="high2">High 2</option>
                                    </select>
                                </div>

                                <div class="setting-item">
                                    <label class="setting-label">Color Gamut</label>
                                    <select id="colorGamut" class="select" onchange="setSetting('colorGamut', this.value)">
                                        <option value="auto">Auto</option>
                                        <option value="native">Native</option>
                                        <option value="wide">Wide</option>
                                    </select>
                                </div>

                                <div class="setting-item">
                                    <label class="setting-label">Dynamic Contrast</label>
                                    <select id="dynamicContrast" class="select" onchange="setSetting('dynamicContrast', this.value)">
                                        <option value="off">Off</option>
                                        <option value="low">Low</option>
                                        <option value="medium">Medium</option>
                                        <option value="high">High</option>
                                    </select>
                                </div>

                                <div class="setting-item">
                                    <label class="setting-label">Peak Brightness</label>
                                    <select id="peakBrightness" class="select" onchange="setSetting('peakBrightness', this.value)">
                                        <option value="off">Off</option>
                                        <option value="low">Low</option>
                                        <option value="medium">Medium</option>
                                        <option value="high">High</option>
                                    </select>
                                </div>

                                <div class="setting-item">
                                    <label class="setting-label">Dynamic Color</label>
                                    <select id="dynamicColor" class="select" onchange="setSetting('dynamicColor', this.value)">
                                        <option value="off">Off</option>
                                        <option value="low">Low</option>
                                        <option value="medium">Medium</option>
                                        <option value="high">High</option>
                                    </select>
                                </div>

                                <div class="setting-item">
                                    <label class="setting-label">Super Resolution</label>
                                    <select id="superResolution" class="select" onchange="setSetting('superResolution', this.value)">
                                        <option value="off">Off</option>
                                        <option value="low">Low</option>
                                        <option value="medium">Medium</option>
                                        <option value="high">High</option>
                                    </select>
                                </div>

                                <div class="setting-item">
                                    <label class="setting-label">Noise Reduction</label>
                                    <select id="noiseReduction" class="select" onchange="setSetting('noiseReduction', this.value)">
                                        <option value="off">Off</option>
                                        <option value="low">Low</option>
                                        <option value="medium">Medium</option>
                                        <option value="high">High</option>
                                        <option value="auto">Auto</option>
                                    </select>
                                </div>

                                <div class="setting-item">
                                    <label class="setting-label">MPEG Noise Reduction</label>
                                    <select id="mpegNoiseReduction" class="select" onchange="setSetting('mpegNoiseReduction', this.value)">
                                        <option value="off">Off</option>
                                        <option value="low">Low</option>
                                        <option value="medium">Medium</option>
                                        <option value="high">High</option>
                                        <option value="auto">Auto</option>
                                    </select>
                                </div>

                                <div class="setting-item">
                                    <label class="setting-label">Smooth Gradation</label>
                                    <select id="smoothGradation" class="select" onchange="setSetting('smoothGradation', this.value)">
                                        <option value="off">Off</option>
                                        <option value="low">Low</option>
                                        <option value="medium">Medium</option>
                                        <option value="high">High</option>
                                    </select>
                                </div>

                                <div class="setting-item">
                                    <label class="setting-label">Real Cinema</label>
                                    <select id="realCinema" class="select" onchange="setSetting('realCinema', this.value)">
                                        <option value="on">On</option>
                                        <option value="off">Off</option>
                                    </select>
                                </div>

                                <div class="setting-item">
                                    <label class="setting-label">Eye Comfort</label>
                                    <select id="eyeComfortMode" class="select" onchange="setSetting('eyeComfortMode', this.value)">
                                        <option value="on">On</option>
                                        <option value="off">Off</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="section">
                        <h2 class="section-title">HDR</h2>
                        <div class="card">
                            <div class="settings-grid">
                                <div class="setting-item">
                                    <label class="setting-label">HDR Tone Mapping</label>
                                    <select id="hdrDynamicToneMapping" class="select" onchange="setSetting('hdrDynamicToneMapping', this.value)">
                                        <option value="on">On</option>
                                        <option value="off">Off</option>
                                        <option value="HGIG">HGIG</option>
                                    </select>
                                </div>

                                <div class="setting-item">
                                    <label class="setting-label">HGIG</label>
                                    <select id="hgig" class="select" onchange="setSetting('hgig', this.value)">
                                        <option value="on">On</option>
                                        <option value="off">Off</option>
                                    </select>
                                </div>

                                <div class="setting-item">
                                    <label class="setting-label">Dolby Precision Detail</label>
                                    <select id="dolbyPrecisionDetail" class="select" onchange="setSetting('dolbyPrecisionDetail', this.value)">
                                        <option value="on">On</option>
                                        <option value="off">Off</option>
                                    </select>
                                </div>

                                <div class="setting-item">
                                    <label class="setting-label">Black Stabilizer <span class="setting-value" id="blackStabilizerValue">0</span></label>
                                    <input type="range" id="blackStabilizer" class="slider" min="0" max="20" value="0" oninput="updateSliderDisplay('blackStabilizer', this.value)" onchange="setSetting('blackStabilizer', parseInt(this.value))">
                                </div>

                                <div class="setting-item">

                    <div class="section">

                                    <input type="range" id="whiteBalanceBlueOffset" class="slider" min="-50" max="50" value="0" oninput="updateSliderDisplay('whiteBalanceBlueOffset', this.value)" onchange="setSetting('whiteBalanceBlueOffset', parseInt(this.value))">

                                <div class="setting-item">
                                    <label class="setting-label">Red Gain <span class="setting-value" id="whiteBalanceRedGainValue">0</span></label>

                                <div class="setting-item">
                                    <label class="setting-label">Green Gain <span class="setting-value" id="whiteBalanceGreenGainValue">0</span></label>
                                    <input type="range" id="whiteBalanceGreenGain" class="slider" min="-50" max="50" value="0" oninput="updateSliderDisplay('whiteBalanceGreenGain', this.value)" onchange="setSetting('whiteBalanceGreenGain', parseInt(this.value))">

                                <div class="setting-item">
                                    <label class="setting-label">Blue Gain <span class="setting-value" id="whiteBalanceBlueGainValue">0</span></label>
                                    <input type="range" id="whiteBalanceBlueGain" class="slider" min="-50" max="50" value="0" oninput="updateSliderDisplay('whiteBalanceBlueGain', this.value)" onchange="setSetting('whiteBalanceBlueGain', parseInt(this.value))">

                <!-- Motion Section -->
                <div id="section-motion" class="content">
                    <div class="section">

                <!-- AI/Other Section -->
                <div id="section-ai" class="content">
                    <div class="section">
                        <h2 class="section-title">AI Picture</h2>
                        <div class="card">

                                <strong>Note:</strong> AI settings can only be set, not read. Current values cannot be displayed.

                            <div class="settings-grid">
                                <div class="setting-item">
                                    <label class="setting-label">AI Picture</label>
                                    <div class="toggle-buttons">
                                        <button class="btn btn-success btn-sm" onclick="setAISetting('ai_Picture', 'on')">ON</button>
                                        <button class="btn btn-danger btn-sm" onclick="setAISetting('ai_Picture', 'off')">OFF</button>
                                    </div>
                                </div>

                                <div class="setting-item">
                                    <label class="setting-label">AI Brightness</label>
                                    <div class="toggle-buttons">
                                        <button class="btn btn-success btn-sm" onclick="setAISetting('ai_Brightness', 'on')">ON</button>
                                        <button class="btn btn-danger btn-sm" onclick="setAISetting('ai_Brightness', 'off')">OFF</button>
                                    </div>
                                </div>

                                <div class="setting-item">
                                    <label class="setting-label">AI Genre</label>
                                    <div class="toggle-buttons">
                                        <button class="btn btn-success btn-sm" onclick="setAISetting('ai_Genre', 'on')">ON</button>
                                        <button class="btn btn-danger btn-sm" onclick="setAISetting('ai_Genre', 'off')">OFF</button>

                    <div class="section">
                        <h2 class="section-title">Other Settings</h2>
                        <div class="card">
                            <div class="settings-grid">
                                <div class="setting-item">
                                    <label class="setting-label">Energy Saving</label>
                                    <select id="energySaving" class="select" onchange="setSetting('energySaving', this.value)">
                                        <option value="off">Off</option>
                                        <option value="min">Minimum</option>
                                        <option value="med">Medium</option>
                                        <option value="max">Maximum</option>
                                        <option value="auto">Auto</option>
                                        <option value="screen_off">Screen Off</option>
                                    </select>
                                </div>
                            </div>

                </div>
            </main>
        </div>
    </div>

    <script>
        let ws = null;
        let messageId = 0;
        let clientKey = localStorage.getItem('lgTvClientKey') || null;
        let connected = false;
        let useSecure = true;
        let pendingRefreshRequests = 0;
        let requestedSettings = {};

        const REGISTRATION_PAYLOAD = {
            "forcePairing": false,
            "manifest": {
                "appVersion": "1.1",
                "manifestVersion": 1,
                "permissions": [
                    "LAUNCH", "LAUNCH_WEBAPP", "APP_TO_APP", "CLOSE", "TEST_OPEN",
                    "TEST_PROTECTED", "CONTROL_AUDIO", "CONTROL_DISPLAY",
                    "CONTROL_INPUT_JOYSTICK", "CONTROL_INPUT_MEDIA_RECORDING",
                    "CONTROL_INPUT_MEDIA_PLAYBACK", "CONTROL_INPUT_TV",
                    "CONTROL_POWER", "CONTROL_TV_SCREEN", "READ_APP_STATUS",
                    "READ_CURRENT_CHANNEL", "READ_INPUT_DEVICE_LIST",
                    "READ_NETWORK_STATE", "READ_RUNNING_APPS", "READ_TV_CHANNEL_LIST",
                    "WRITE_NOTIFICATION_TOAST", "READ_POWER_STATE", "READ_COUNTRY_INFO",
                    "CONTROL_INPUT_TEXT", "CONTROL_MOUSE_AND_KEYBOARD",
                    "READ_INSTALLED_APPS", "READ_SETTINGS", "READ_STORAGE_DEVICE_LIST"
                ],
                "signatures": [{
                    "signature": "eyJhbGdvcml0aG0iOiJSU0EtU0hBMjU2Iiwia2V5SWQiOiJ0ZXN0LXNpZ25pbmctY2VydCIsInNpZ25hdHVyZVZlcnNpb24iOjF9.hrVRgjCwXVvE2OOSpDZ58hR+59aFNwYDyjQgKk3auukd7pcegmE2CzPCa0bJ0ZsRAcKkCTJrWo5iDzNhMBWRyaMOv5zWSrthlf7G128qvIlpMT0YNY+n/FaOHE73uLrS/g7swl3/qH/BGFG2Hu4RlL48eb3lLKqTt2xKHdCs6Cd4RMfJPYnzgvI4BNrFUKsjkcu+WD4OO2A27Pq1n50cMchmcaXadJhGrOqH5YmHdOCj5NSHzJYrsW0HPlpuAx/ECMeIZYDh6RMqaFM2DXzdKX9NmmyqzJ3o/0lkk/N97gfVRLW5hA29yeAwaCViZNCP8iC9aO0q9fQojoa7NQnAtw==",
                    "signatureVersion": 1
                }],
                "signed": {
                    "appId": "com.lge.test",
                    "created": "20140509",
                    "localizedAppNames": {"": "LG Remote App", "ko-KR": "리모컨 앱", "zxx-XX": "ЛГ Rэмotэ AПП"},
                    "localizedVendorNames": {"": "LG Electronics"},
                    "permissions": [
                        "TEST_SECURE", "CONTROL_INPUT_TEXT", "CONTROL_MOUSE_AND_KEYBOARD",
                        "READ_INSTALLED_APPS", "READ_LGE_SDX", "READ_NOTIFICATIONS", "SEARCH",
                        "WRITE_SETTINGS", "WRITE_NOTIFICATION_ALERT", "CONTROL_POWER",
                        "READ_CURRENT_CHANNEL", "READ_RUNNING_APPS", "READ_UPDATE_INFO",
                        "UPDATE_FROM_REMOTE_APP", "READ_LGE_TV_INPUT_EVENTS", "READ_TV_CURRENT_TIME"
                    ],
                    "serial": "2f930e2d2cfe083771f68e4fe7bb07",
                    "vendorId": "com.lge"
                }
            },
            "pairingType": "PROMPT"
        };

        function showStatus(message, type = 'info') {
            const statusEl = document.getElementById('status');
            statusEl.textContent = message;
            statusEl.className = `alert ${type}`;
            statusEl.style.display = 'block';
            console.log(`[${type.toUpperCase()}] ${message}`);
        }

        function showCertHelp(show) {
            document.getElementById('certHelp').style.display = show ? 'block' : 'none';
        }

        function openCertPage() {
            const ip = document.getElementById('tvIp').value.trim();
            if (!ip) {
                showStatus('Please enter a TV IP address first', 'error');
                return;
            }
            window.open(`https://${ip}:3001/`, '_blank');
            showStatus('After accepting the certificate, close that tab and click Connect', 'info');
        }

        function updateUI(isConnected) {
            connected = isConnected;
            document.getElementById('connectBtn').disabled = isConnected;
            document.getElementById('disconnectBtn').disabled = !isConnected;
            document.getElementById('tvIp').disabled = isConnected;
            document.getElementById('controls').style.display = isConnected ? 'block' : 'none';
            if (isConnected) showCertHelp(false);
        }

        function connect() {
            const ip = document.getElementById('tvIp').value.trim();
            if (!ip) {
                showStatus('Please enter a TV IP address', 'error');
                return;
            }

            showCertHelp(false);
            const wsUrl = `wss://${ip}:3001`;
            showStatus('Connecting to TV...', 'info');
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                console.log('WebSocket connected');
                showStatus('WebSocket connected, registering...', 'info');
                const registrationMsg = {
                    "type": "register",
                    "id": "register_0",
                    "payload": clientKey ? {...REGISTRATION_PAYLOAD, "client-key": clientKey} : REGISTRATION_PAYLOAD
                };
                console.log('Sending registration:', registrationMsg);
                ws.send(JSON.stringify(registrationMsg));
            };

            ws.onmessage = (event) => {
                console.log('Received:', event.data);
                const message = JSON.parse(event.data);

                if (message.type === 'response' && message.id === 'register_0') {
                    if (message.payload.pairingType === 'PROMPT') {
                        showStatus('Please accept the connection on your TV!', 'warning');
                    }
                } else if (message.type === 'registered') {
                    clientKey = message.payload['client-key'];
                    localStorage.setItem('lgTvClientKey', clientKey);
                    console.log('Registered! Client key:', clientKey);
                    showStatus('Connected successfully!', 'success');
                    updateUI(true);
                    refreshAllSettings();
                } else if (message.type === 'response') {
                    if (message.id.startsWith('alert_') && message.payload && message.payload.alertId) {
                        const alertId = message.payload.alertId;
                        console.log(`Alert created with ID: ${alertId}, closing it...`);
                        messageId++;
                        ws.send(JSON.stringify({
                            "id": `close_alert_${messageId}`,
                            "type": "request",
                            "uri": "ssap://system.notifications/closeAlert",
                            "payload": {"alertId": alertId}
                        }));
                        showStatus('AI setting applied successfully', 'success');
                        return;
                    }

                    if (message.payload && message.payload.settings) {
                        updateSettingsUI(message.payload.settings);
                        if (message.id.startsWith('set_')) {
                            showStatus('Setting applied successfully', 'success');
                        } else if (message.id.startsWith('get_')) {
                            const requestedKeys = requestedSettings[message.id] || [];
                            const returnedKeys = Object.keys(message.payload.settings);
                            const missingKeys = requestedKeys.filter(key => !returnedKeys.includes(key));

                            console.group(`📥 GET Response: ${message.id}`);
                            console.log('Requested:', requestedKeys);
                            console.log('Returned:', returnedKeys);
                            if (missingKeys.length > 0) {
                                console.warn('⚠️ Missing keys:', missingKeys);
                                missingKeys.forEach(key => markSettingUnavailable(key));
                            }
                            console.groupEnd();

                            if (pendingRefreshRequests > 0) {
                                pendingRefreshRequests--;
                                if (pendingRefreshRequests === 0) {
                                    showStatus('Settings loaded!', 'success');
                                }
                            }
                        }
                    }
                } else if (message.type === 'error') {
                    handleError(message);
                }
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                showStatus('Connection failed. You may need to accept the SSL certificate first.', 'error');
                showCertHelp(true);
            };

            ws.onclose = (event) => {
                console.log('WebSocket closed', event);
                if (!connected && event.code !== 1000) {
                    showStatus('Connection failed. You may need to accept the SSL certificate first.', 'error');
                    showCertHelp(true);
                } else if (connected) {
                    showStatus('Disconnected from TV', 'info');
                }
                updateUI(false);
                ws = null;
            };
        }

        function handleError(message) {
            if (message.id.startsWith('get_')) {
                const requestedKeys = requestedSettings[message.id] || [];
                console.group(`❌ GET Error: ${message.id}`);
                console.log('Requested keys:', requestedKeys);
                console.groupEnd();
                requestedKeys.forEach(key => markSettingUnavailable(key));

                if (pendingRefreshRequests > 0) {
                    pendingRefreshRequests--;
                    if (pendingRefreshRequests === 0) {
                        showStatus('Settings loaded (some not available on this TV)', 'success');
                    }
                }
            } else if (message.id.startsWith('set_')) {
                const errorText = message.payload?.errorText || message.error || '';
                if (errorText.includes('not allowed') || errorText.includes('not available')) {
                    const settingName = message.id.replace(/^set_/, '').replace(/_\d+$/, '');
                    markSettingUnavailable(settingName);
                } else {
                    showStatus(`Error: ${errorText}`, 'error');
                }
            }
        }

        function disconnect() {
            if (ws) {
                ws.close();
                ws = null;
            }
            updateUI(false);
            showStatus('Disconnected', 'info');
        }

        function clearClientKey() {
            clientKey = null;
            localStorage.removeItem('lgTvClientKey');
            showStatus('Saved client key cleared. Try connecting again.', 'info');
        }

        function showSection(section) {
            document.querySelectorAll('.content').forEach(el => el.classList.remove('active'));
            document.getElementById('section-' + section).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('mobileMenu').classList.remove('active');
            document.querySelector('.hamburger').classList.remove('active');
        }

        function toggleMenu() {
            const menu = document.getElementById('mobileMenu');
            const hamburger = document.querySelector('.hamburger');
            menu.classList.toggle('active');
            hamburger.classList.toggle('active');
        }

        function setSetting(settingName, value, currentApp = false) {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                showStatus('Not connected to TV', 'error');
                return;
            }

            messageId++;
            const payload = {
                "category": "picture",
                "settings": {}
            };
            payload.settings[settingName] = String(value);

            if (currentApp) {
                payload.current_app = true;
            }

            const message = {
                "id": `set_${settingName}_${messageId}`,
                "type": "request",
                "uri": "ssap://settings/setSystemSettings",
                "payload": payload
            };

            console.log(`Setting ${settingName} to:`, value);
            ws.send(JSON.stringify(message));
            showStatus(`Setting ${settingName}...`, 'info');

            if (settingName === 'truMotionMode') {
                const blurRow = document.getElementById('truMotionBlurRow');
                const judderRow = document.getElementById('truMotionJudderRow');
                if (value === 'user') {
                    blurRow.style.display = 'block';
                    judderRow.style.display = 'block';
                } else {
                    blurRow.style.display = 'none';
                    judderRow.style.display = 'none';
                }
            }
        }

        function markSettingUnavailable(settingName) {
            const element = document.getElementById(settingName);
            if (element) {
                element.disabled = true;
                const row = element.closest('.setting-item');
                if (row) {
                    row.classList.add('unavailable');
                }
            }
        }

        function setAISetting(settingName, value) {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                showStatus('Not connected to TV', 'error');
                return;
            }

            messageId++;
            const lunaParams = {
                "category": "aiPicture",
                "settings": {}
            };
            lunaParams.settings[settingName] = value;

            const lunaUri = "luna://com.webos.settingsservice/setSystemSettings";
            const alertPayload = {
                "message": " ",
                "buttons": [{
                    "label": "",
                    "onClick": lunaUri,
                    "params": lunaParams
                }],
                "onclose": {"uri": lunaUri, "params": lunaParams},
                "onfail": {"uri": lunaUri, "params": lunaParams}
            };

            const createAlertMsg = {
                "id": `alert_${settingName}_${messageId}`,
                "type": "request",
                "uri": "ssap://system.notifications/createAlert",
                "payload": alertPayload
            };

            console.log(`Setting AI ${settingName} to ${value} via Luna alert hack:`, createAlertMsg);
            ws.send(JSON.stringify(createAlertMsg));
            showStatus(`Setting ${settingName}...`, 'info');
        }

        function setPictureMode(mode) {
            if (!mode) return;
            setSetting('pictureMode', mode);
        }

        function updateSliderDisplay(settingName, value) {
            document.getElementById(`${settingName}Value`).textContent = value;
        }

        function refreshAllSettings() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                showStatus('Not connected to TV', 'error');
                return;
            }

            showStatus('Refreshing settings...', 'info');
            pendingRefreshRequests = 7;
            requestedSettings = {};

            const requests = [
                {id: 'basic', keys: ["pictureMode", "backlight", "contrast", "brightness", "color", "tint", "sharpness", "colorTemperature"]},
                {id: 'advanced', keys: ["blackLevel", "gamma", "colorGamut", "dynamicContrast", "peakBrightness", "dynamicColor", "superResolution"]},
                {id: 'nr', keys: ["noiseReduction", "mpegNoiseReduction", "smoothGradation", "realCinema", "eyeComfortMode", "energySaving"]},
                {id: 'hdr', keys: ["hdrDynamicToneMapping", "hgig", "dolbyPrecisionDetail", "blackStabilizer", "whiteStabilizer"]},
                {id: 'wb', keys: ["whiteBalanceColorTemperature", "whiteBalancePoint", "whiteBalanceRedOffset", "whiteBalanceGreenOffset", "whiteBalanceBlueOffset", "whiteBalanceRedGain", "whiteBalanceGreenGain", "whiteBalanceBlueGain"]},
                {id: 'trumotion', keys: ["truMotionMode"], currentApp: true},
                {id: 'motion', keys: ["truMotionBlur", "truMotionJudder", "motionEyeCare", "motionProOLED"]}
            ];

            requests.forEach(req => {
                messageId++;
                const msgId = `get_${req.id}_${messageId}`;
                requestedSettings[msgId] = req.keys;
                const payload = {
                    "category": "picture",
                    "keys": req.keys
                };
                if (req.currentApp) payload.current_app = true;

                ws.send(JSON.stringify({
                    "id": msgId,
                    "type": "request",
                    "uri": "ssap://settings/getSystemSettings",
                    "payload": payload
                }));
            });
        }

        function updateSettingsUI(settings) {
            for (let [key, value] of Object.entries(settings)) {
                if (key === 'blackLevel' && typeof value === 'object' && value !== null) {
                    const uniqueValues = [...new Set(Object.values(value))];
                    if (uniqueValues.length === 1) {
                        value = uniqueValues[0];
                    } else {
                        markSettingUnavailable(key);
                        continue;
                    }
                }

                const element = document.getElementById(key);
                if (element) {
                    element.disabled = false;
                    const row = element.closest('.setting-item');
                    if (row) row.classList.remove('unavailable');

                    if (element.type === 'range') {
                        element.value = value;
                        updateSliderDisplay(key, value);
                    } else if (element.tagName === 'SELECT') {
                        const optionExists = Array.from(element.options).some(opt => opt.value === value);
                        if (optionExists) {
                            element.value = value;
                        }
                    }
                }
            }

            if (settings.truMotionMode) {
                const blurRow = document.getElementById('truMotionBlurRow');
                const judderRow = document.getElementById('truMotionJudderRow');
                if (settings.truMotionMode === 'user') {
                    blurRow.style.display = 'block';
                    judderRow.style.display = 'block';
                } else {
                    blurRow.style.display = 'none';
                    judderRow.style.display = 'none';
                }
            }
        }
    </script>
